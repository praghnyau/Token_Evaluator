<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; font-family: 'Segoe UI', sans-serif; margin: 0; background: #0f0f0f; color: #e0e0e0; }
  .header { background: #1a1a2e; padding: 12px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #2a2a4a; }
  .header h1 { margin: 0; font-size: 14px; font-weight: 600; color: #a78bfa; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  .dot.offline { background: #ef4444; }
  .section { padding: 12px 16px; border-bottom: 1px solid #1e1e1e; }
  .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #6b7280; margin-bottom: 6px; }
  .quality-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
  .Good { background: #14532d; color: #4ade80; }
  .Average { background: #713f12; color: #fbbf24; }
  .Bad { background: #450a0a; color: #f87171; }
  .confidence-bar { height: 4px; background: #1e1e1e; border-radius: 2px; margin-top: 6px; }
  .confidence-fill { height: 100%; border-radius: 2px; background: #a78bfa; transition: width 0.3s; }
  .conf-text { font-size: 10px; color: #6b7280; margin-top: 3px; }
  .suggestion { font-size: 11px; color: #d1d5db; background: #1a1a1a; border-left: 3px solid #a78bfa; padding: 6px 8px; border-radius: 0 4px 4px 0; margin-bottom: 4px; line-height: 1.4; }
  .status { font-size: 11px; color: #6b7280; padding: 10px 16px; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="dot" id="dot"></div>
  <h1>Prompt Analytics</h1>
</div>

<div id="main-content">
  <div class="status" id="status-msg">Waiting for prompt input...</div>
</div>

<script>
chrome.storage.local.get(['quality','confidence','suggestions','connected'], (data) => {
  const dot = document.getElementById('dot');
  const main = document.getElementById('main-content');

  if (!data.connected) {
    dot.classList.add('offline');
    main.innerHTML = '<div class="status">⚠️ Backend offline. Start the server first.</div>';
    return;
  }

  if (!data.quality) {
    main.innerHTML = '<div class="status">Waiting for prompt input...</div>';
    return;
  }

  const conf = Math.round((data.confidence || 0) * 100);
  const suggestions = (data.suggestions || []).slice(0, 3);

  main.innerHTML = `
    <div class="section">
      <div class="label">Prompt Quality</div>
      <span class="quality-badge ${data.quality}">${data.quality}</span>
      <div class="confidence-bar"><div class="confidence-fill" style="width:${conf}%"></div></div>
      <div class="conf-text">Confidence: ${conf}%</div>
    </div>
    <div class="section">
      <div class="label">Suggestions</div>
      ${suggestions.map(s => `<div class="suggestion">${s}</div>`).join('')}
    </div>
  `;
});
</script>
</body>
</html>
